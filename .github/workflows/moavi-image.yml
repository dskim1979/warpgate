# MOAVI build (MAKUS SYSTEMS): Korean keyboardType fix + Korean UI.
# Builds ghcr.io/dskim1979/warpgate:<MOAVI_TAG> for linux/amd64, smoke-tests it,
# and pushes only the pinned tag (never `latest`).
name: MOAVI image

on:
  push:
    branches: ['moavi/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dskim1979/warpgate
  MOAVI_TAG: 0.29.2-moavi1
  UPSTREAM_IMAGE: ghcr.io/warp-tech/warpgate:0.29.2

concurrency:
  group: moavi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: npm ci + svelte-check
        working-directory: warpgate-web
        run: |
          npm ci
          npm run check

  keyboard-type-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: moavi-kbd
          workspaces: |
            . -> target
            vendor/ironrdp-pdu -> target
      - name: Vendored ironrdp-pdu unit tests
        run: cargo test --manifest-path vendor/ironrdp-pdu/Cargo.toml --features std -- gcc::core_data::client::tests
      - name: warpgate-protocol-rdp keyboardType tests (patched crate in the real build graph)
        run: cargo test -p warpgate-protocol-rdp -- keyboard_type_tests

  image:
    needs: [web-check, keyboard-type-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          large-packages: false
          docker-images: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image (linux/amd64, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          file: docker/Dockerfile
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.MOAVI_TAG }}
          labels: |
            org.opencontainers.image.title=Warpgate (MOAVI build)
            org.opencontainers.image.vendor=MAKUS SYSTEMS
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=moavi-amd64
          cache-to: type=gha,mode=max,scope=moavi-amd64

      - name: Install smoke-test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb freerdp2-x11 jq

      - name: Smoke test (starts, /@warpgate 200, Korean UI, RDP keyboardType 8)
        run: |
          set -euo pipefail
          ./.github/moavi-smoke.sh "$IMAGE:$MOAVI_TAG" moavi expect-ok

      - name: Control - upstream 0.29.2 rejects keyboardType 8 (informational)
        continue-on-error: true
        run: |
          docker pull -q "$UPSTREAM_IMAGE"
          ./.github/moavi-smoke.sh "$UPSTREAM_IMAGE" upstream expect-reject

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push pinned tag
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$MOAVI_TAG"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$MOAVI_TAG")"
          {
            echo "### Pushed"
            echo ""
            echo "- \`$IMAGE:$MOAVI_TAG\`"
            echo "- \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
